on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'phpstan.neon'

  push:
    branches: ['master']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'phpstan.neon'

name: mutation test

permissions:
  contents: read

jobs:
  mutation:
    uses: yiisoft/actions/.github/workflows/infection.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.6']
      infection-args: "--ignore-msi-with-no-mutations"
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
